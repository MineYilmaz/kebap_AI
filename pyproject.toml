[project]
name = "kebap-ai"
version = "0.1.0"
description = "A configurable Flask starter app for a kitchen idea generator."
readme = "instructions/README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "anthropic>=2.7.0",
    "deepeval>=4.3.3",
    "portalocker[win32]>=4.4.2",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -m 'not integration'"
pythonpath = ["."]
markers = [
    "unit: tests that use mocks and do not access the network",
    "integration: tests that call the configured live chatbot service",
]

[tool.uv]
package = false
